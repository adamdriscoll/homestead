name: CI
on:
  push:
  pull_request:
  workflow_call:
    outputs:
      version:
        description: Application version derived from the release tag
        value: ${{ jobs.foundation.outputs.version }}
jobs:
  foundation:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: src/Homestead/package-lock.json
      - run: node --test tests/smoke/release-version.test.mjs
      - name: Set application version from release tag
        id: version
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'release'
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name || github.ref_name }}
        run: |
          version=$(node .github/scripts/release-version.mjs "$RELEASE_TAG")
          echo "HOMESTEAD_VERSION=$version" >> "$GITHUB_ENV"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Install supported Hugo
        run: |
          curl -fsSL -o /tmp/hugo.tar.gz https://github.com/gohugoio/hugo/releases/download/v0.152.2/hugo_0.152.2_linux-amd64.tar.gz
          curl -fsSL -o /tmp/hugo_checksums.txt https://github.com/gohugoio/hugo/releases/download/v0.152.2/hugo_0.152.2_checksums.txt
          cd /tmp
          grep ' hugo_0.152.2_linux-amd64.tar.gz$' hugo_checksums.txt | sed 's/hugo_0.152.2_linux-amd64.tar.gz/hugo.tar.gz/' | sha256sum --check
          tar -xzf hugo.tar.gz hugo
          sudo install hugo /usr/local/bin/hugo
          hugo version
      - run: dotnet restore
      - name: Build application
        run: |
          version_args=()
          if [[ -n "$HOMESTEAD_VERSION" ]]; then version_args+=("-p:Version=$HOMESTEAD_VERSION"); fi
          dotnet build --no-restore --configuration Release "${version_args[@]}"
      - run: dotnet test --no-build --configuration Release
        env:
          HOMESTEAD_FIXTURE_OUTPUT: ${{ runner.temp }}/homestead-fixtures
      - uses: actions/upload-artifact@v4
        with:
          name: portability-fixtures
          path: ${{ runner.temp }}/homestead-fixtures/*.zip
      - run: dotnet format --verify-no-changes --no-restore
      - run: dotnet tool restore
      - run: dotnet ef migrations has-pending-model-changes --project src/Homestead --no-build --configuration Release
      - run: docker build -f deploy/Dockerfile -t homestead-smoke --build-arg HOMESTEAD_VERSION .
      - run: node tests/smoke/docker-smoke.mjs
